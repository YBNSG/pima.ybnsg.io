<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - PIMA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            text-align: center;
        }
        header {
            background-color: #2e7d32;
            color: white;
            padding: 20px 0;
        }
        .container {
            width: 90%;
            max-width: 800px;
            margin: auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            text-align: left;
        }
        h2 {
            color: #2e7d32;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 10px;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #2e7d32;
            color: white;
            padding: 10px;
            border: none;
            margin-top: 15px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }
        button:hover {
            background-color: #256327;
        }
        footer {
            text-align: center;
            background-color: #2e7d32;
            color: white;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>PIMA</h1>
        <p>Contacto</p>
    </header>
    <div class="container">
        <h2>Contáctanos</h2>
        <p>Si tienes preguntas o deseas más información sobre nuestros servicios, no dudes en comunicarte con nosotros.</p>
        
        <form action="#" method="post">
            <label for="name">Nombre:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="phone">Teléfono:</label>
            <input type="tel" id="phone" name="phone" required>
            
            <label for="subject">Asunto:</label>
            <select id="subject" name="subject">
                <option value="consulta">Consulta General</option>
                <option value="servicios">Información sobre Servicios</option>
                <option value="colaboracion">Colaboraciones</option>
                <option value="otros">Otros</option>
            </select>
            
            <label for="message">Mensaje:</label>
            <textarea id="message" name="message" rows="5" required></textarea>
            
            <label>
                <input type="checkbox" name="newsletter"> Deseo recibir novedades y actualizaciones por correo electrónico.
            </label>
            
            <button type="submit">Enviar</button>
        </form>
    </div>
    <footer>
        <p>&copy; 2025 PIMA - Control de Especies Invasoras</p>
    </footer>
</body>
</html>
